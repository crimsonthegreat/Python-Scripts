[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "network-tools"
version = "0.1.0"
description = "Reusable network automation functions"
requires-python = ">=3.10"

dependencies = [
    "netmiko",
    "pyyaml",
    "python-dotenv",
    "meraki",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["network_tools*"]